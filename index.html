<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .required {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Loan Application</h1>

        <p class="subtitle">
            Please provide the following information
        </p>

        <form action="/predict" method="get">

            <!-- Customer Name -->
            <div class="form-group">
                <label for="customer_name">
                    Customer Name <span class="required">*</span>
                </label>

                <input type="text" id="customer_name" name="customer_name" placeholder="Enter your full name" required>
            </div>

            <!-- Income -->
            <div class="form-group">
                <label for="income">
                    Income <span class="required">*</span>
                </label>

                <input type="number" id="income" name="inc" placeholder="Enter your income" min="0" required>
            </div>

            <!-- Loan Amount -->
            <div class="form-group">
                <label for="loan_amount">
                    Loan Amount <span class="required">*</span>
                </label>

                <input type="number" id="loan_amount" name="lam" placeholder="Enter required loan amount" min="0"
                    required>
            </div>

            <!-- Credit Score -->
            <div class="form-group">
                <label for="credit_score">
                    Credit Score <span class="required">*</span>
                </label>

                <input type="number" id="credit_score" name="crd" placeholder="Enter your credit score" min="0"
                    max="900" required>
            </div>

            <!-- Age -->
            <div class="form-group">
                <label for="age">
                    Age <span class="required">*</span>
                </label>

                <input type="number" id="age" name="ag" placeholder="Enter your age" min="18" required>
            </div>

            <!-- Repayment Tenure -->
            <div class="form-group">
                <label for="repayment_tenure">
                    Repayment Tenure (Months) <span class="required">*</span>
                </label>

                <input type="number" id="repayment_tenure" name="rtm" placeholder="Enter repayment tenure" min="1"
                    required>
            </div>

            <button type="submit">
                Submit Loan Application
            </button>

        </form>

    </div>

</body>

</html>
